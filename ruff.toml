line-length = 120

[format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
line-ending = "lf"

[lint]
select = ["E", "F", "I", "N"]
ignore = [
    "W191",
    "E111",
    "E114",
    "E117",
    "D206",
    "D300",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "COM812",
    "COM819",
    "ISC002",
]
